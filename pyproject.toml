[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-demo"
version = "0.1.0"
description = "Multi-agent demo for digital safety monitoring of teenagers (privacy-by-design, metadata-only)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "langgraph>=0.2",
    "pydantic>=2.0",
    "streamlit>=1.57",
    "plotly>=5.20",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
